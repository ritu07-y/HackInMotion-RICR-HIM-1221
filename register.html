<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | LearnAI</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                🧠
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Start your personalized learning journey
            </p>


            <form id="registerForm">


                <!-- Full Name -->

                <div class="input-group">

                    <label for="registerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="input-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword(
                                'registerPassword',
                                this
                            )"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- Confirm Password -->

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword(
                                'confirmPassword',
                                this
                            )"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- Terms -->

                <label class="terms-checkbox">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the Terms & Conditions
                    </span>

                </label>


                <!-- Create Account -->

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Create Account
                </button>


            </form>


            <!-- =================================
                 OR DIVIDER
            ================================== -->

            <div class="divider">

                <span></span>

                <p>OR</p>

                <span></span>

            </div>


            <!-- =================================
                 GOOGLE REGISTER
            ================================== -->

            <button
                type="button"
                class="google-btn"
                onclick="googleRegister()"
            >

                <img
                    src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                    alt="Google"
                >

                <span>
                    Continue with Google
                </span>

            </button>


            <!-- Login -->

            <p class="bottom-text">

                Already have an account?

                <a href="index.html">
                    Login
                </a>

            </p>


        </div>

    </div>


    <div id="toast"></div>


    <script src="script.js"></script>

</body>

</html>
